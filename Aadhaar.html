<!DOCTYPE html>
<html>
<head>
    <title>Aadhaar Card</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: #eef;
    margin: 0;
    padding: 0;
}

.card {
    width: 350px;
    padding: 20px;
    background: #ffffff;
    border: 2px solid #000;
    margin: 60px auto;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.card h3 {
    text-align: center;
    margin-bottom: 15px;
    color: #333;
    letter-spacing: 1px;
}

.card p {
    font-size: 14px;
    margin: 8px 0;
    color: #222;
}

.card p b {
    color: #000;
}
        body { font-family: Arial; background:#eef; }
        .card {
            width: 350px; padding: 15px; background: white;
            border: 2px solid #000; margin: 50px auto;
        }

</head>
<body>
    <div class="card">
        <h3>AADHAAR CARD</h3>
        <p><b>Name:</b> Rahul Sharma</p>

        <p><b>DOB:</b> 01/01/1998</p>

</html>
